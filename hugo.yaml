baseURL: https://weblamb.github.io/
locale: zh-cn
defaultContentLanguage: zh
hasCJKLanguage: true
title: MoWang Blog
theme: ["hugo-theme-stack"]

pagination:
  pagerSize: 3

caches:
  images:
    dir: :cacheDir/images

params:
  mainSections:
    - posts
  rssFullContent: true
  favicon: img/avatar.svg
  sidebar:
    emoji: "✍️"
    subtitle: "记录技术、实践与思考"
    avatar: img/avatar.svg
  footer:
    since: 2026
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc
  comments:
    enabled: false

menu:
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/weblamb/weblamb.github.io
      params:
        icon: brand-github
        newTab: true
